<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 仓库查询</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0d1117; color: #e6edf3; margin: 0; padding: 24px 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { color: #8b949e; font-size: 14px; margin: 0 0 18px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; font-size: 15px; border-radius: 8px;
          border: 1px solid #30363d; background: #161b22; color: #e6edf3; }
  button { padding: 10px 18px; font-size: 15px; border-radius: 8px; border: 0;
           background: #238636; color: #fff; cursor: pointer; }
  button:disabled { background: #30363d; cursor: wait; }
  #msg { margin-top: 14px; font-size: 14px; min-height: 20px; }
  #msg.err { color: #f85149; }
  #msg.loading { color: #8b949e; }
  .card { margin-top: 12px; border: 1px solid #30363d; border-radius: 12px;
          padding: 18px; background: #161b22; display: none; }
  .card.show { display: block; }
  .card .top { display: flex; gap: 12px; align-items: center; }
  .card img { width: 56px; height: 56px; border-radius: 50%; }
  .card h2 { font-size: 18px; margin: 0; }
  .card h2 a { color: #58a6ff; text-decoration: none; }
  .card .desc { color: #8b949e; font-size: 14px; margin: 10px 0; }
  .stats { display: flex; gap: 16px; font-size: 14px; flex-wrap: wrap; }
  .stats b { color: #f0b429; }
  .foot { margin-top: 18px; font-size: 12px; color: #6e7681; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 GitHub 仓库查询</h1>
  <p class="sub">调用 GitHub 公开 API，无需注册、无需密钥，直接查任意公开仓库。</p>
  <div class="row">
    <input id="repo" placeholder="输入 owner/仓库名，如 ryajia321/codelab" value="ryajia321/codelab">
    <button id="btn">查询</button>
  </div>
  <div id="msg"></div>
  <div class="card" id="card">
    <div class="top">
      <img id="avatar" alt="头像">
      <div>
        <h2><a id="name" href="#" target="_blank" rel="noopener"></a></h2>
        <div class="desc" id="owner"></div>
      </div>
    </div>
    <div class="desc" id="desc"></div>
    <div class="stats">
      <span>⭐ <b id="stars"></b></span>
      <span>⑂ <b id="forks"></b></span>
      <span>💻 <b id="lang"></b></span>
      <span>🕐 <b id="updated"></b></span>
    </div>
  </div>
  <p class="foot">数据来自 api.github.com 实时查询。未登录每小时限 60 次，省着点点。</p>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };

function setMsg(text, cls){
  var m = $("msg");
  m.textContent = text;
  m.className = cls || "";
}

function validRepo(s){
  // 只允许 owner/repo 形状：每段以字母数字开头，后接字母数字 . _ -，中间一道斜杠
  return /^[A-Za-z0-9][A-Za-z0-9_.\-]*\/[A-Za-z0-9][A-Za-z0-9_.\-]*$/.test(s.trim());
}

function fmtDate(iso){
  try { return new Date(iso).toLocaleDateString("zh-CN"); }
  catch(e){ return iso; }
}

function query(){
  var repo = $("repo").value.trim();
  if(!validRepo(repo)){
    setMsg("格式不对：请输入 owner/仓库名，例如 ryajia321/codelab", "err");
    return;
  }
  var btn = $("btn");
  btn.disabled = true;
  $("card").classList.remove("show");
  setMsg("查询中…", "loading");

  fetch("https://api.github.com/repos/" + repo)
    .then(function(res){
      if(res.status === 404){
        throw new Error("仓库不存在（404）：检查 owner/仓库名是否写对，注意大小写。");
      }
      if(res.status === 403){
        throw new Error("触发频率限制（403）：GitHub 未登录每小时只让查 60 次，歇会儿再试。");
      }
      if(!res.ok){
        throw new Error("GitHub 返回异常状态码：" + res.status);
      }
      return res.json();
    })
    .then(function(d){
      $("avatar").src = d.owner.avatar_url;
      var nm = $("name");
      nm.textContent = d.full_name;
      nm.href = d.html_url;
      $("owner").textContent = "作者：" + d.owner.login;
      $("desc").textContent = d.description || "（这个仓库没有写简介）";
      $("stars").textContent = d.stargazers_count;
      $("forks").textContent = d.forks_count;
      $("lang").textContent = d.language || "未知";
      $("updated").textContent = fmtDate(d.updated_at);
      $("card").classList.add("show");
      setMsg("");
    })
    .catch(function(err){
      // 网络断开、域名被拦等都会走到这里
      setMsg("查不到：" + err.message, "err");
    })
    .finally(function(){
      btn.disabled = false;
    });
}

$("btn").addEventListener("click", query);
$("repo").addEventListener("keydown", function(e){
  if(e.key === "Enter") query();
});
</script>
</body>
</html>
